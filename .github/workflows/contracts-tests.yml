name: Contracts Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hardhat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Hardhat test suite
        run: npm test
